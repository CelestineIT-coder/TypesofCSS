<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Site</title>
</head>
<body style="background-color:#EDE7F6; font-family: Verdana, sans-serif; margin:0;">

    <header style="background-color:#D7CCC8; padding:30px; text-align:center; color:#4A148C;">
        <h1>Inline CSS Website</h1>
    </header>

    <section style="padding:60px; text-align:center;">
        <div style="background-color:#F3E5F5; padding:25px; width:55%; margin:auto; border-radius:20px; box-shadow:0 5px 15px rgba(0,0,0,0.15);">
            <h2 style="color:#6A1B9A;">What does this do?</h2>
            <p style="color:#5D4037; font-size:18px;">
                This website uses INLINE CSS directly inside HTML elements.
            </p>
        </div>
    </section>

    <footer style="background-color:#D7CCC8; text-align:center; padding:20px; color:#4A148C;">
        <p>Inline CSS Example</p>
    </footer>

</body>
</html>
