<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Site</title>

    <style>
        body {
            background-color: #E6E6FA; /* lavender */
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #D8BFD8;
            padding: 20px;
            text-align: center;
            color: white;
        }

        section {
            padding: 40px;
            text-align: center;
        }

        .card {
            background-color: #F8F0FF;
            padding: 20px;
            margin: 20px auto;
            width: 60%;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        footer {
            background-color: #D8BFD8;
            text-align: center;
            padding: 15px;
            color: white;
        }
    </style>

</head>
<body>

<header>
    <h1>Lavender Internal CSS</h1>
</header>

<section>
    <div class="card">
        <h2>What does it do?</h2>
        <p>This website uses INTERNAL CSS styling inside the style tag.</p>
    </div>
</section>

<footer>
    <p>Internal CSS Example</p>
</footer>

</body>
</html>
